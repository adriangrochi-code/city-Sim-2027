[package]
name = "motor"
version = "0.10.0"
edition = "2021"
description = "Motor de vóxeles del juego (época colonial rioplatense)"

[dependencies]
wgpu = "=22.1.0"
pollster = "0.3"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fastnoise-lite = "1.1"
winit = "0.30"
egui = "0.29"
egui-wgpu = { version = "0.29", default-features = false }
egui-winit = { version = "0.29", default-features = false, features = ["links", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
