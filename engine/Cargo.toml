[package]
name = "motor"
version = "0.1.0"
edition = "2021"
description = "Motor de vóxeles del juego (época colonial rioplatense)"

[dependencies]
wgpu = "=22.1.0"
pollster = "0.3"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fastnoise-lite = "1.1"
winit = "0.30"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
